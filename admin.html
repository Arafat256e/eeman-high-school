<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login | Eeman High School</title><link rel="stylesheet" href="css/style.css"></head><body class="admin-body"><header class="admin-top"><div class="container"><a class="brand" href="index.html"><img src="assets/school-logo.jpeg" alt="School crest"><span><strong style="color:white">Eeman High School</strong><small>Website administration</small></span></a><a href="index.html">← View website</a></div></header><main class="admin-shell"><section class="admin-card" id="login-card"><p class="eyebrow">SECURE STAFF ACCESS</p><h1 style="font-size:2.7rem;color:var(--purple-deep)">Admin <em style="color:var(--purple-bright)">login.</em></h1><p class="admin-intro">Sign in with an administrator account created in Supabase Authentication. This page does not create public accounts.</p><form id="login-form" class="admin-form"><label for="email">Administrator email</label><input id="email" type="email" autocomplete="username" required><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required><button class="btn btn-purple" type="submit">Sign in <span>↗</span></button><p id="login-status" role="status"></p></form></section>
